name: Feature Request
description: Suggest an idea, new calculator formula, or cheatsheet
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Worth! Please verify the tool does not already exist in the [Calculator Index](https://njohn931d-dotcom.github.io/bbbh/) or [Docs Hub](docs/).
  - type: textarea
    id: feature-description
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I am frustrated when trying to calculate...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution or Calculation Formula
      description: Describe the formula, math steps, or developer cheatsheet content you would like added.
      placeholder: "Formula: Hourly = (Salary * 1.35) / 1500..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any other tools, scripts, or workarounds you currently use.
