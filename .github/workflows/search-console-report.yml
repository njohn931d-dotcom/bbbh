name: Private Search Console opportunity report

on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read


jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check optional Search Console credentials
        id: credentials
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Search Console report skipped: add the optional GSC_SERVICE_ACCOUNT_JSON repository secret and grant that service account read access to the Search Console property." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate private report
        if: steps.credentials.outputs.configured == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/gsc-opportunities.mjs --out=seo-reports/search-opportunities.md

      - name: Upload private report
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: search-console-opportunities-${{ github.run_id }}
          path: seo-reports/search-opportunities.md
          if-no-files-found: error
          retention-days: 14
