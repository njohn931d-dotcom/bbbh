name: Deploy Worth (133 SEO Pages) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - name: Install deps
        run: npm ci
      
      - name: Test (133 URLs)
        run: npm test
      
      - name: Generate markdown mirrors (40 articles)
        run: node scripts/generate-articles-md.mjs
      
      - name: Build production (requires SITE_URL)
        env:
          SITE_URL: https://njohn931d-dotcom.github.io/bbbh
        run: npm run build:production
      
      - name: Verify dist (133 pages)
        run: |
          ls -R dist | head -n 40
          echo "Sitemap URLs: $(grep -o '<loc>' dist/sitemap.xml | wc -l)"
          echo "Guide pages: $(find dist/articles -name index.html | wc -l)"
          echo "llms.txt exists: $(ls -lh dist/llms.txt)"
          echo "feed.xml items: $(grep -o '<item>' dist/feed.xml | wc -l)"
          test -f dist/articles/index.html
          test -f dist/articles/work-hours/price-to-hours-formula/index.html
          test -f dist/sitemap.xml
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
