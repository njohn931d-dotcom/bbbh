name: Deploy Worth (133 SEO Pages) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - name: Install deps
        run: npm ci
      
      - name: Test (133 URLs + 40 guides)
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- full test log ---"
            cat /tmp/test.log
            tail -c 3500 /tmp/test.log | sed 's/%/%25/g' | tr '\n' '@' | sed 's/@/%0A/g' > /tmp/msg.txt
            echo "::error::$(cat /tmp/msg.txt)"
          else
            echo "✓ All tests passed"
            cat /tmp/test.log | tail -20
          fi
          exit "$status"
      
      - name: Generate markdown mirrors (40 articles)
        run: node scripts/generate-articles-md.mjs
      
      - name: Build production (requires SITE_URL)
        env:
          SITE_URL: https://njohn931d-dotcom.github.io/bbbh
        run: npm run build:production
      
      - name: Verify dist (133 pages) - MAX CHECKS
        run: |
          echo "=== DIST STRUCTURE ==="
          ls -R dist | head -n 100
          echo ""
          echo "=== SITEMAP ==="
          echo "Sitemap URLs: $(grep -o '<loc>' dist/sitemap.xml | wc -l) (expected 133)"
          echo "Sitemap lastmod present: $(grep -o '<lastmod>' dist/sitemap.xml | wc -l)"
          echo ""
          echo "=== GUIDE PAGES ==="
          echo "Guide pages: $(find dist/articles -name index.html | wc -l) (expected 46)"
          echo ""
          echo "=== DISCOVERY FILES ==="
          echo "llms.txt: $(ls -lh dist/llms.txt)"
          echo "ai.txt: $(ls -lh dist/ai.txt)"
          echo "feed.xml items: $(grep -o '<item>' dist/feed.xml | wc -l) (expected 86+)"
          echo "robots.txt: $(cat dist/robots.txt)"
          echo ""
          echo "=== MANIFEST & PWA ==="
          ls -lh dist/manifest.json
          cat dist/manifest.json | head -20
          echo ""
          echo "=== CRITICAL FILES ==="
          test -f dist/index.html && echo "✓ index.html"
          test -f dist/404.html && echo "✓ 404.html (SPA fallback)"
          test -f dist/.nojekyll && echo "✓ .nojekyll"
          test -f dist/manifest.json && echo "✓ manifest.json"
          test -f dist/humans.txt && echo "✓ humans.txt"
          test -f dist/security.txt && echo "✓ security.txt"
          test -f dist/articles/index.html && echo "✓ articles/index.html"
          test -f dist/articles/work-hours/price-to-hours-formula/index.html && echo "✓ sample guide"
          test -f dist/calculators/cost-of-time/index.html && echo "✓ sample calculator"
          test -f dist/sitemap.xml && echo "✓ sitemap.xml"
          test -f dist/robots.txt && echo "✓ robots.txt"
          test -f dist/feed.xml && echo "✓ feed.xml"
          test -f dist/llms.txt && echo "✓ llms.txt"
          test -f dist/ai.txt && echo "✓ ai.txt"
          echo ""
          echo "=== HTML VALIDATION ==="
          echo "Total HTML files: $(find dist -name index.html | wc -l)"
          echo "Checking for canonical URLs..."
          grep -r "rel=\"canonical\"" dist --include="*.html" | wc -l
          echo "Checking for manifest links..."
          grep -r "manifest.json" dist --include="*.html" | wc -l
          echo ""
          echo "=== SIZE REPORT ==="
          du -sh dist
          du -sh dist/assets/*
          echo ""
          echo "=== SECURITY ==="
          echo "No secrets in dist: $(! grep -r -i "api_key\|secret\|password" dist --include="*.html" --include="*.js" && echo "✓ clean" || echo "⚠ found")"
      
      - name: Lighthouse & SEO Quick Check
        run: |
          echo "Checking meta tags..."
          echo "Title tags: $(grep -o '<title>' dist/index.html | wc -l)"
          echo "Description tags: $(grep -o 'meta name=\"description\"' dist/index.html | wc -l)"
          echo "OG tags: $(grep -o 'og:' dist/index.html | wc -l)"
          echo "Structured data: $(grep -o 'application/ld+json' dist/index.html | wc -l)"
          echo ""
          echo "Checking internal links..."
          echo "Home links to calculators: $(grep -o '/calculators/' dist/index.html | wc -l)"
          echo "Home links to guides: $(grep -o '/guides/' dist/index.html | wc -l)"
          echo "Home links to articles: $(grep -o '/articles/' dist/index.html | wc -l)"
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Verify deployment
        run: |
          echo "Deployed to: ${{ steps.deployment.outputs.page_url }}"
          echo "Waiting 10s for Pages to propagate..."
          sleep 10
          curl -s -o /dev/null -w "%{http_code}" ${{ steps.deployment.outputs.page_url }} || echo "Site check"
          echo "✓ Deployment completed"

  # Optional: notify on success
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Success notification
        run: |
          echo "🎉 Worth deployed successfully!"
          echo "URL: https://njohn931d-dotcom.github.io/bbbh/"
          echo "Sitemap: https://njohn931d-dotcom.github.io/bbbh/sitemap.xml"
          echo "133 pages live"
